<!DOCTYPE html>
<html lang="en" data-theme="light" style="background:#dedad6">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#dedad6" id="theme-meta"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Calc+</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@900&family=DM+Sans:wght@500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[data-theme="light"]{
  --bg:#dedad6;--face:#e6e2de;--face-hi:#f0ede9;--face-lo:#cac6c2;
  --sh-d:#b0ada9;--sh-u:rgba(255,255,255,.85);--ink:#1e1e1e;--ink-dim:#9a9692;--ink-faint:#c8c4c0;
  --pbg1:#2c2c2c;--pbg2:#181818;--psh:#0a0a0a;--pink:#fff;
  --ebg1:#484848;--ebg2:#282828;--esh:#0e0e0e;--eink:#fff;
  --numg:linear-gradient(160deg,#b0aca8 0%,#7a7672 40%,#4a4642 100%);
  --tc:#aaa6a2;--ttrack:#c8c4c0;--tball:#e8e4e0;--tbsh:rgba(0,0,0,.25);
  --sbg:#f5f2ef;--ssec:#e6e2de;--sbrd:rgba(0,0,0,.07);--shov:#dedad6;
  --acc:#007aff;--red:#ff3b30;--grn:#34c759;--ov:rgba(0,0,0,.45);
  --le-bg:#dedad6;--le-cell:rgba(0,0,0,.055);--le-celld:1.5px dashed rgba(0,0,0,.18);
}
[data-theme="dark"]{
  --bg:#181818;--face:#242424;--face-hi:#2e2e2e;--face-lo:#161616;
  --sh-d:#080808;--sh-u:rgba(255,255,255,.05);--ink:#e4e0dc;--ink-dim:#686460;--ink-faint:#383432;
  --pbg1:#4a90e2;--pbg2:#2563b8;--psh:#1040a0;--pink:#fff;
  --ebg1:#505050;--ebg2:#303030;--esh:#000;--eink:#fff;
  --numg:linear-gradient(160deg,#dedad6 0%,#aaa6a2 40%,#6a6662 100%);
  --tc:#585450;--ttrack:#3a3a3a;--tball:#e4e0dc;--tbsh:rgba(0,0,0,.5);
  --sbg:#1c1c1e;--ssec:#2c2c2e;--sbrd:rgba(255,255,255,.07);--shov:#3a3a3c;
  --acc:#0a84ff;--red:#ff453a;--grn:#30d158;--ov:rgba(0,0,0,.65);
  --le-bg:#181818;--le-cell:rgba(255,255,255,.045);--le-celld:1.5px dashed rgba(255,255,255,.12);
}
html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);transition:background .3s;margin:0}
/* Phone shell — full screen on mobile, centered on wide desktop */
.phone-wrap{
  width:100vw;height:100vh;height:100dvh;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);
  transition:background .3s;
}
/* Only show sidebar bg on truly wide screens */
@media(min-width:500px){
  .phone-wrap{background:#1a1a1a}
}
.phone{
  width:100%;max-width:430px;
  height:100%;max-height:860px;
  background:var(--bg);
  display:grid;grid-template-rows:1fr auto;
  overflow:hidden;position:relative;
  transition:background .3s;
}
@media(max-width:499px){
  .phone{max-width:100%;max-height:100%}
}
.toggle-wrap{position:absolute;top:16px;left:16px;z-index:10}
.tog{width:64px;height:32px;border-radius:16px;background:var(--ttrack);cursor:pointer;position:relative;border:none;outline:none;padding:0;transition:background .3s;box-shadow:inset 0 2px 5px rgba(0,0,0,.28)}
.tog::before{content:"☀️";position:absolute;left:7px;top:50%;transform:translateY(-50%);font-size:13px;pointer-events:none}
.tog::after{content:"🌙";position:absolute;right:7px;top:50%;transform:translateY(-50%);font-size:13px;pointer-events:none}
.tog-ball{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--tball);box-shadow:0 2px 6px var(--tbsh);transition:transform .28s cubic-bezier(.34,1.4,.64,1);pointer-events:none}
[data-theme="dark"] .tog-ball{transform:translateX(32px)}
.sBtn{position:absolute;top:16px;right:16px;z-index:10;width:32px;height:32px;border-radius:50%;background:linear-gradient(155deg,var(--face-hi),var(--face),var(--face-lo));box-shadow:0 3px 0 var(--sh-d),0 5px 10px rgba(0,0,0,.18),inset 0 1px 0 var(--sh-u);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;outline:none}
.sBtn:active{transform:translateY(2px)}
.disp{display:flex;flex-direction:column;padding:0 16px 10px;overflow:hidden;min-height:0;position:relative;justify-content:flex-end}
.num-wrap{display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;flex-shrink:0;padding:8px 0 6px;gap:0;width:100%}
.tot-lbl{font-size:clamp(9px,2.8vw,12px);color:var(--ink-faint);letter-spacing:.14em;text-transform:uppercase}
.num{font-family:'Nunito',sans-serif;font-weight:900;line-height:1;letter-spacing:-.02em;text-align:center;white-space:nowrap;user-select:none;background:var(--numg);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;transition:font-size .12s ease}
.live-expr-wrap{
  display:flex;flex-direction:column;align-items:flex-end;
  padding:0 4px;width:100%;
  overflow:hidden;
}
.live-expr-eq{
  font-size:clamp(12px,3.8vw,15px);
  color:var(--ink-dim);
  font-family:'DM Sans',sans-serif;
  font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:100%;text-align:right;
  opacity:0;
  transition:opacity .12s ease;
  line-height:1.3;
}
.live-expr-eq.show{opacity:1}
.live-expr-result{
  font-size:clamp(15px,5vw,20px);
  color:var(--acc);
  font-family:'DM Sans',sans-serif;
  font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:100%;text-align:right;
  opacity:0;
  transition:opacity .08s ease;
  line-height:1.2;
}
.live-expr-result.show{opacity:1}
.sw-hint{font-size:clamp(9px,2.8vw,12px);color:var(--ink-faint);text-align:center;opacity:0;transition:opacity .4s;margin-top:2px}
.sw-hint.show{opacity:1}
.mem-b{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:clamp(8px,2.4vw,10px);color:var(--acc);font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none}
.mem-b.show{opacity:1}
@keyframes pop{0%{transform:scale(.85);opacity:.2}65%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .22s cubic-bezier(.34,1.56,.64,1) both}
@keyframes shake{0%,100%{transform:translateX(0) scale(1)}25%{transform:translateX(-8px) scale(1.02)}75%{transform:translateX(8px) scale(1.02)}}
.shake{animation:shake .32s ease}
.btn-area{padding:6px 12px 26px}
.btn-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;width:100%}
.btn{border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;outline:none;user-select:none;border-radius:22px;transition:box-shadow 70ms,transform 70ms,background .3s;touch-action:manipulation;font-family:'DM Sans',system-ui;-webkit-user-select:none}
.b-dig{font-size:clamp(18px,7.4vw,32px);font-weight:700;color:var(--ink);border-radius:18px;background:linear-gradient(155deg,var(--face-hi),var(--face),var(--face-lo));box-shadow:0 5px 0 var(--sh-d),0 7px 14px rgba(0,0,0,.22),inset 0 1px 0 var(--sh-u)}
.b-dig.dn{transform:translateY(4px);background:linear-gradient(155deg,var(--face-lo),var(--face));box-shadow:0 1px 0 var(--sh-d),inset 0 2px 6px rgba(0,0,0,.2)}
.b-act{font-size:clamp(14px,5vw,21px);font-weight:600;color:var(--ink-dim);background:linear-gradient(155deg,var(--face-hi),var(--face),var(--face-lo));box-shadow:0 5px 0 var(--sh-d),0 7px 14px rgba(0,0,0,.2),inset 0 1px 0 var(--sh-u)}
.b-act.dn{transform:translateY(4px);background:linear-gradient(155deg,var(--face-lo),var(--face));box-shadow:0 1px 0 var(--sh-d),inset 0 2px 5px rgba(0,0,0,.15)}
.b-op{font-size:clamp(28px,11vw,46px);font-weight:300;color:var(--pink);border-radius:18px;background:linear-gradient(160deg,var(--pbg1),var(--pbg2));box-shadow:0 6px 0 var(--psh),0 9px 22px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12)}
.b-op.dn{transform:translateY(5px);background:linear-gradient(160deg,var(--pbg2),var(--pbg1));box-shadow:0 1px 0 var(--psh),inset 0 3px 10px rgba(0,0,0,.4)}
.b-zero{font-size:clamp(18px,7.4vw,32px);font-weight:700;color:var(--ink);justify-content:flex-start;padding-left:clamp(18px,8vw,28px);background:linear-gradient(155deg,var(--face-hi),var(--face),var(--face-lo));box-shadow:0 5px 0 var(--sh-d),0 7px 14px rgba(0,0,0,.22),inset 0 1px 0 var(--sh-u)}
.b-zero.dn{transform:translateY(4px);background:linear-gradient(155deg,var(--face-lo),var(--face));box-shadow:0 1px 0 var(--sh-d),inset 0 2px 6px rgba(0,0,0,.15)}
.b-eq{font-size:clamp(20px,7vw,30px);font-weight:600;color:var(--eink);background:linear-gradient(155deg,var(--ebg1),var(--ebg2));box-shadow:0 5px 0 var(--esh),0 8px 18px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.1)}
.b-eq.dn{transform:translateY(4px);background:linear-gradient(155deg,var(--ebg2),var(--ebg1));box-shadow:0 1px 0 var(--esh),inset 0 3px 8px rgba(0,0,0,.35)}
.b-ext{font-size:clamp(13px,4.8vw,20px);font-weight:700;color:var(--ink-dim);background:linear-gradient(155deg,var(--face-hi),var(--face),var(--face-lo));box-shadow:0 5px 0 var(--sh-d),0 7px 14px rgba(0,0,0,.2),inset 0 1px 0 var(--sh-u)}
.b-ext.dn{transform:translateY(4px);background:linear-gradient(155deg,var(--face-lo),var(--face));box-shadow:0 1px 0 var(--sh-d),inset 0 2px 5px rgba(0,0,0,.15)}

.le-ov{position:fixed;inset:0;z-index:500;background:var(--le-bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .45s cubic-bezier(.32,.72,0,1)}
.le-ov.open{transform:translateY(0)}
.le-bar{display:flex;align-items:center;padding:14px 16px 10px;border-bottom:1px solid var(--sbrd);background:var(--sbg);flex-shrink:0;gap:8px}
.le-cancel{background:none;border:none;color:var(--red);font-size:clamp(13px,4.2vw,17px);font-family:'DM Sans',sans-serif;font-weight:600;cursor:pointer;padding:6px 0;min-width:72px}
.le-ttl{flex:1;text-align:center;font-size:clamp(15px,4.8vw,20px);font-weight:700;color:var(--ink);font-family:'DM Sans',sans-serif}
.le-done{background:var(--acc);border:none;color:#fff;font-size:clamp(13px,4.2vw,17px);font-family:'DM Sans',sans-serif;font-weight:700;cursor:pointer;padding:7px 18px;border-radius:20px;min-width:72px;text-align:center}
.le-hint{padding:6px 20px 5px;font-size:clamp(9px,3vw,12px);color:var(--ink-dim);font-family:'DM Sans',sans-serif;text-align:center;background:var(--sbg);border-bottom:1px solid var(--sbrd);flex-shrink:0}
.le-canvas{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;padding-bottom:80px;width:100%;max-width:430px;margin:0 auto}
.le-canvas::-webkit-scrollbar{display:none}
.le-grid{position:relative;margin:0 auto;margin-top:8px;max-width:406px;padding:0 12px;}
.le-gcell{position:absolute;background:var(--le-cell);border-radius:13px;border:var(--le-celld);pointer-events:none;transition:background .12s,border-color .12s}
.le-gcell.ok{background:rgba(0,122,255,.13);border:2px solid var(--acc)}
.le-gcell.bad{background:rgba(255,59,48,.13);border:2px solid var(--red)}
.le-b{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:16px;font-family:'DM Sans',sans-serif;font-weight:700;cursor:pointer;user-select:none;touch-action:none;-webkit-user-select:none;transition:left .18s cubic-bezier(.34,1.1,.64,1),top  .18s cubic-bezier(.34,1.1,.64,1),width  .18s cubic-bezier(.34,1.1,.64,1),height .18s cubic-bezier(.34,1.1,.64,1),opacity .15s,box-shadow .15s;overflow:visible;will-change:left,top,width,height;}
.le-b.sel{z-index:20}
.le-b.sel.light-btn{box-shadow:0 0 0 3.5px var(--acc),0 8px 20px rgba(0,0,0,.28) !important}
.le-b.sel.dark-btn {box-shadow:0 0 0 3.5px rgba(255,255,255,.9),0 8px 20px rgba(0,0,0,.4) !important}
.le-b.src{opacity:.38;transition:opacity .1s !important;z-index:4}
.le-b.pushed{z-index:3}
.le-del{position:absolute;top:-11px;right:-11px;width:23px;height:23px;border-radius:50%;background:var(--red);color:#fff;font-size:11px;font-weight:900;line-height:1;display:flex;align-items:center;justify-content:center;z-index:35;cursor:pointer;border:2.5px solid var(--le-bg);box-shadow:0 2px 8px rgba(0,0,0,.28);pointer-events:all;}
.le-del:active{transform:scale(.86)}
.le-grip{position:absolute;bottom:3px;right:3px;width:26px;height:26px;cursor:se-resize;z-index:32;display:flex;align-items:flex-end;justify-content:flex-end;pointer-events:all;touch-action:none;}
.le-grip-svg{width:16px;height:16px;opacity:.55}
.le-ghost{position:absolute;z-index:100;pointer-events:none;border-radius:16px;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;font-weight:700;transform:scale(1.055);box-shadow:0 18px 44px rgba(0,0,0,.38),0 6px 12px rgba(0,0,0,.2) !important;transition:none !important;will-change:left,top;}
.le-fab{position:fixed;bottom:24px;right:20px;width:54px;height:54px;border-radius:50%;background:var(--acc);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,122,255,.42);z-index:60;border:none;cursor:pointer;transition:transform .2s,box-shadow .2s;}
.le-fab:active{transform:scale(.88)}
.le-ap{position:fixed;bottom:0;left:0;right:0;background:var(--sbg);border-radius:22px 22px 0 0;z-index:650;transform:translateY(100%);transition:transform .38s cubic-bezier(.32,.72,0,1);max-height:72vh;display:flex;flex-direction:column}
.le-ap.open{transform:translateY(0)}
.le-ap-hdr{display:flex;align-items:center;padding:18px 20px 10px;border-bottom:1px solid var(--sbrd);flex-shrink:0;position:relative}
.le-ap-grab{width:36px;height:5px;background:var(--ink-faint);border-radius:3px;position:absolute;top:8px;left:50%;transform:translateX(-50%)}
.le-ap-ttl{flex:1;font-size:clamp(15px,4.8vw,20px);font-weight:700;color:var(--ink);font-family:'DM Sans',sans-serif}
.le-ap-cls{background:var(--ssec);border:none;color:var(--ink-dim);cursor:pointer;padding:6px 14px;border-radius:20px;font-size:clamp(12px,3.8vw,15px);font-weight:600;font-family:'DM Sans',sans-serif}
.le-ap-sc{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 14px 30px}
.le-ap-sc::-webkit-scrollbar{display:none}
.le-ap-row{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--ssec);border-radius:14px;margin-bottom:8px}
.le-ap-ico{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--face-hi),var(--face-lo));display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:var(--ink);flex-shrink:0}
.le-ap-nm{font-size:clamp(12px,4vw,16px);color:var(--ink);font-family:'DM Sans',sans-serif;font-weight:600}
.le-ap-ds{font-size:clamp(10px,3.2vw,13px);color:var(--ink-dim);font-family:'DM Sans',sans-serif}
.le-ap-add{background:var(--grn);color:#fff;border:none;border-radius:20px;padding:6px 16px;font-size:clamp(12px,3.8vw,15px);font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;flex-shrink:0}
.le-ap-add:disabled{background:var(--ink-faint);opacity:.6;cursor:default}

.s-ov{position:fixed;inset:0;z-index:200;background:var(--ov);opacity:0;pointer-events:none;transition:opacity .35s;display:flex;align-items:flex-end;justify-content:center;}
.s-ov.open{opacity:1;pointer-events:all}
.s-sh{position:relative;width:100%;max-width:430px;height:min(92vh,92dvh,680px);background:var(--sbg);border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .42s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;overflow:hidden}
.s-ov.open .s-sh{transform:translateY(0)}
.s-grab{width:40px;height:5px;border-radius:3px;background:var(--ink-faint);margin:10px auto 0;flex-shrink:0}
.s-pages{position:relative;flex:1;overflow:hidden}
.s-pg{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--sbg);transform:translateX(100%);transition:transform .32s cubic-bezier(.25,.46,.45,.94),opacity .32s;opacity:0;pointer-events:none}
.s-pg.active{transform:translateX(0);opacity:1;pointer-events:all}
.s-pg.behind{transform:translateX(-28%);opacity:.6;pointer-events:none}
.s-hdr{display:flex;align-items:center;gap:8px;padding:14px 16px 12px;flex-shrink:0;border-bottom:1px solid var(--sbrd)}
.s-back{background:none;border:none;cursor:pointer;padding:4px 8px 4px 0;color:var(--acc);font-size:clamp(13px,4.2vw,17px);font-family:'DM Sans',sans-serif;font-weight:600;display:flex;align-items:center;gap:2px}
.s-back svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.s-ttl{font-size:clamp(16px,5.2vw,22px);font-weight:700;color:var(--ink);flex:1;font-family:'DM Sans',sans-serif}
.s-xb{width:30px;height:30px;border-radius:50%;background:var(--ssec);border:none;cursor:pointer;color:var(--ink-dim);font-size:14px;display:flex;align-items:center;justify-content:center;font-weight:700}
.s-sc{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 0 40px}
.s-sc::-webkit-scrollbar{display:none}
.s-card{display:flex;align-items:center;gap:14px;padding:16px 20px;margin:0 16px 16px;background:var(--ssec);border-radius:16px}
.s-ico{width:52px;height:52px;border-radius:13px;flex-shrink:0;background:linear-gradient(135deg,var(--pbg1),var(--pbg2));display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;font-weight:900;font-size:20px;color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.s-lbl{font-size:clamp(9px,3vw,12px);color:var(--ink-dim);letter-spacing:.1em;text-transform:uppercase;padding:0 20px 6px;font-family:'DM Sans',sans-serif}
.s-box{margin:0 16px 12px;background:var(--ssec);border-radius:16px;overflow:hidden}
.s-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--sbrd);cursor:pointer;transition:background .15s}
.s-row:last-child{border-bottom:none}
.s-row:active{background:var(--shov)}
.s-row.nt{cursor:default}.s-row.nt:active{background:transparent}
.s-ri{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px}
.s-rl{flex:1;font-size:clamp(13px,4.2vw,17px);color:var(--ink);font-family:'DM Sans',sans-serif;font-weight:500}
.s-rv{font-size:clamp(12px,4vw,16px);color:var(--ink-dim);font-family:'DM Sans',sans-serif}
.s-ra{color:var(--ink-faint);font-size:clamp(12px,4vw,16px);margin-left:2px}
.s-tog{width:50px;height:28px;border-radius:14px;border:none;cursor:pointer;position:relative;background:var(--ink-faint);transition:background .25s;flex-shrink:0;box-shadow:inset 0 1px 4px rgba(0,0,0,.25)}
.s-tog.on{background:var(--grn)}
.s-tog::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.34,1.4,.64,1)}
.s-tog.on::after{transform:translateX(22px)}
.s-seg{display:flex;background:var(--face-lo);border-radius:10px;padding:2px;gap:2px;width:100%}
.s-so{flex:1;padding:8px 4px;text-align:center;border-radius:8px;cursor:pointer;font-size:clamp(12px,4.5vw,16px);font-weight:600;color:var(--ink-dim);border:none;background:transparent;font-family:'DM Sans',sans-serif;line-height:1;transition:background .15s,color .15s,box-shadow .15s}
.s-so.sel{background:var(--face-hi);color:var(--ink);box-shadow:0 1px 6px rgba(0,0,0,.2)}
.s-dng{width:calc(100% - 32px);margin:8px 16px;padding:14px;border-radius:12px;background:rgba(255,59,48,.1);border:1px solid rgba(255,59,48,.25);color:var(--red);font-size:clamp(13px,4.2vw,17px);font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;text-align:center;display:block;transition:background .15s}
.s-dng:active{background:rgba(255,59,48,.22)}
.s-fmp{font-family:'Courier New',monospace;font-size:clamp(15px,5vw,20px);color:var(--acc);padding:10px 20px 0;text-align:center}
.s-ar{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--sbrd)}
.s-ar:last-child{border-bottom:none}
.s-ak{font-size:clamp(12px,4vw,16px);color:var(--ink-dim);font-family:'DM Sans',sans-serif;flex:1}
.s-av{font-size:clamp(12px,4vw,16px);color:var(--ink);font-family:'DM Sans',sans-serif;font-weight:600}
.s-dbg{display:inline-flex;align-items:center;background:var(--red);color:#fff;font-size:clamp(9px,3vw,12px);font-weight:700;padding:4px 10px;border-radius:20px;margin:12px 16px 4px;font-family:'DM Sans',sans-serif}
.b-blank{border:2px dashed var(--ink-faint)!important;background:transparent!important;box-shadow:none!important;border-radius:14px;opacity:.55;}
